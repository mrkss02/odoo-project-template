services:
  db:
    container_name: ${COMPOSE_PROJECT_NAME}-db
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER}
      interval: 10s
      retries: 5

volumes:
  db:
